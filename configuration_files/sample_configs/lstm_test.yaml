database: "archive/cardio_train.parquet"
result_location: "results/"
outlier_detection_technique: "combo"
machine_learning_model: "lstm"
automate_feature_selection: false
use_one_predictor: false
use_global_accuracy: true
use_one_model_type: false
expand_data_multiplier: 0
expanded_file_name: null
full_accuracy: false
planned_clusters: 2
approximate_sampled_rows: 10000000
sampling_seed: 17
sample_max_attempts: 5
num_processes: 22
index_column_name: "Index"

runtime_parameters:
  choice_6:
    predictor: weight
    clustering: supervised
    cluster_alg: KM
    accuracy: 1
    split_size: 50
    preprocess_data: false
    postprocess_data: true
    batch_size: "256MB"
    batch_method: exhaustive_search

# Specifies the behavior for missing values
handle_nulls:
  age:
    method: outliers
    replacement_value: -1
  gender:
    method: outliers
    replacement_value: -1
  height:
    method: outliers
    replacement_value: -1
  weight:
    method: outliers
    replacement_value: -1
  ap_hi:
    method: outliers
    replacement_value: -1
  ap_lo:
    method: outliers
    replacement_value: -1
  cholesterol:
    method: outliers
    replacement_value: -1
  gluc:
    method: outliers
    replacement_value: -1
  smoke:
    method: outliers
    replacement_value: -100
  alco:
    method: outliers
    replacement_value: -300
  active:
    method: outliers
    replacement_value: -1
  cardio:
    method: outliers
    replacement_value: -1

# Specifies which features are used to predictors for other features
# If automate_feature_selection is set to true or use_single_predictor is set to true, this section will be ignored
