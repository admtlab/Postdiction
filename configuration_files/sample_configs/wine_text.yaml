# Specifies the behavior for missing values
handle_nulls:
  "title":
    method: replace_missing_value
    replacement_value: ""
  description:
    method: replace_missing_value
    replacement_value: ""
  "country":
    method: replace_missing_value
    replacement_value: ""
  "designation":
    method: replace_missing_value
