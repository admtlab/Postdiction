database: "archive/winemag-data-130k-v2.parquet"
result_location: "results/"
outlier_detection_technique: "combo"
machine_learning_model: 'lstm'
automate_feature_selection: false
use_one_predictor: true
use_global_accuracy: true
use_one_model_type: true
expand_data_multiplier: 0
expanded_file_name: null
full_accuracy: false
#planned_clusters: 2
approximate_sampled_rows: 100
sampling_seed: 17
sample_max_attempts: 5
num_processes: 22
index_column_name: 'Index'
memory_logging: false
max_unsupervised_depth: 1000
exhaustive_check_fallback: true
excluded_attributes:
  - "points"

runtime_parameters:
    choice_1:
      predictor:
        - "winery"
      clustering: supervised
      cluster_alg: KM
      machine_learning_model: 'lstm'
      accuracy: 0.25
      split_size: 4
      preprocess_data: false
      postprocess_data: true
      batch_size: "32MB"
      batch_method: kd_tree_index
      persist_structures: false
      build_analysis: false
      provide_error: false
      binary: false
      embed_model: "qwen3"
      embed_dim: 32
