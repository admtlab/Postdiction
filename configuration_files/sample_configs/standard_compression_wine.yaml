database: "archive/winemag-data-130k-v2.csv"
result_location: "results/"
machine_learning_model: "none"
expand_data_multiplier: 0
text_limit_training: false
runtime_parameters:
  lzma:
    clustering: none
    compression_parameters:
      method: "lzma"
      compressed_columns:
        - "Index"
        - "country"
        - "description"
        - "designation"
        - "points"
        - "province"
        - "region_1"
        - "region_2"
        - "taster_name"
        - "taster_twitter_handle"
