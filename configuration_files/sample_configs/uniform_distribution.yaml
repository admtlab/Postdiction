database: "archive/exceeds_ram/zipf.parquet"
result_location: "results/"
outlier_detection_technique: "combo"
machine_learning_model: "linear_regression"
automate_feature_selection: false
use_one_predictor: true
use_global_accuracy: true
use_one_model_type: true
expand_data_multiplier: 0
expanded_file_name: null
full_accuracy: false
planned_clusters: 2
approximate_sampled_rows: 100000
sampling_seed: 17
sample_max_attempts: 5
num_processes: 22
index_column_name: "uid"
memory_logging: false
# max_unsupervised_depth: 1000

runtime_parameters:
  choice_7:
    predictor:
      - "employeeID"
    clustering: unsupervised
    cluster_alg: Minhal
    machine_learning_model: "linear_regression"
    accuracy: 1
    split_size: 4
    preprocess_data: false
    postprocess_data: true
    batch_size: "256MB"
    batch_method: array_index
    persist_structures: false
    build_analysis: true
    provide_error: false

handle_nulls:
  employeeID:
    method: outliers
    replacement_value: -1
  age:
    method: outliers
    replacement_value: -1
  salary:
    method: outliers
    replacement_value: -1
  yearsOfExperience:
    method: outliers
    replacement_value: -1
  firstYearAtCompany:
    method: outliers
    replacement_value: -1

# Specifies which features are used to predictors for other features
