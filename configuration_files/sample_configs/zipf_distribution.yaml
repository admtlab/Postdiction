database: "archive/exceeds_ram/zipf.parquet"
result_location: "results/"
outlier_detection_technique: "combo"
machine_learning_model: "linear_regression"
automate_feature_selection: false
use_one_predictor: false
expand_data_multiplier: 0
expanded_file_name: null
full_accuracy: false
planned_clusters: 2
approximate_sampled_rows: 10000000
sampling_seed: 17
sample_max_attempts: 5
index_column_name: "uid"

runtime_parameters:
  choice_2:
    predictor: employeeID
    clustering: unsupervised
    cluster_alg: Minhal
    accuracy: 1
    split_size: 4
    preprocess_data: false
    postprocess_data: true
    batch_size: "256MB"
    batch_method: array_index

handle_nulls:
  employeeID:
    method: outliers
    replacement_value: -1
  age:
    method: outliers
    replacement_value: -1
  salary:
    method: outliers
    replacement_value: -1
  yearsOfExperience:
    method: outliers
    replacement_value: -1
  firstYearAtCompany:
    method: outliers
    replacement_value: -1

# Specifies which features are used to predictors for other features
# If automate_feature_selection is set to true or use_single_predictor is set to true, this section will be ignored
predicted_by:
  age:
    predictors:
      - "employeeID"
    accuracy: 1
    model: "linear_regression"
    clustering: unsupervised
    cluster_alg: Minhal
    batch_method: array_index
  salary:
    predictors:
      - "employeeID"
    accuracy: 1
    model: "linear_regression"
    clustering: unsupervised
    cluster_alg: Minhal
    batch_method: array_index
  yearsOfExperience:
    predictors:
      - "employeeID"
    accuracy: 1
    model: "linear_regression"
    clustering: unsupervised
    cluster_alg: Minhal
    batch_method: array_index
  firstYearAtCompany:
    predictors:
      - "employeeID"
    accuracy: 1
    model: "linear_regression"
    clustering: unsupervised
    cluster_alg: Minhal
    batch_method: array_index
